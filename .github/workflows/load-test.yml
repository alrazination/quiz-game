name: Load test

on:
  workflow_dispatch:
    inputs:
      players:
        description: 'Number of simulated players'
        required: true
        default: '100'
        type: choice
        options: ['100', '500', '1000', '2000']
      worker_url:
        description: 'Your Worker wss:// URL, e.g. wss://quiz-game-worker.you.workers.dev'
        required: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run simulation
        working-directory: scripts
        run: timeout 300 node simulate.js --url "${{ inputs.worker_url }}" --players "${{ inputs.players }}" || true
